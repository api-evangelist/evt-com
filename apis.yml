name: EVT

description: EVT Limited is an Australian entertainment, hospitality and leisure group operating across Australia, New Zealand,
  Singapore and Southeast Asia. Its Entertainment division runs cinemas (including Event Cinemas, IMAX and ScreenX screens,
  and outdoor Moonlight Cinemas), theatre, bars and restaurants; Travel covers hotels and resorts such as QT, Rydges and LyLo
  plus Thredbo Resort; Ventures spans property, development, entertainment technology services and media. In October 2026
  Event Cinemas announced an app in ChatGPT for session search and ticket booking. Surfaced via the API Evangelist harvest
  backlog (australia-apidays-2026).

